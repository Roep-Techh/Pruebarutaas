<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Conductor</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .version {
      color: #777;
      font-size: 14px;
    }

    .status {
      margin: 25px 0;
      padding: 18px;
      background: #f5f5f5;
      border-radius: 12px;
    }

    button {
      border: 0;
      padding: 13px 18px;
      border-radius: 10px;
      margin-right: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="card">

      <h1>🚐 Panel de Conductor</h1>

      <div class="version">
        Versión 1.0
      </div>

      <div class="status">
        <p>Ruta: <strong>#001</strong></p>
        <p>Estado: <strong id="estado">Listo</strong></p>
        <p>Pasajeros: <strong>12</strong></p>
      </div>

      <button onclick="iniciar()">
        Iniciar ruta
      </button>

      <button onclick="finalizar()">
        Finalizar
      </button>

    </div>
  </main>

  <script>

    function iniciar() {
      document.getElementById("estado").textContent = "En ruta";
    }

    function finalizar() {
      document.getElementById("estado").textContent = "Finalizada";
    }

  </script>

</body>
</html>
